---
layout: default
---
<main class="blog-post">
  <article>
    <a class="blog-back-link" href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a>
    <div class="blog-post-heading">
      <time class="blog-post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      <h1 class="blog-post-title">{{ page.title }}</h1>
      <img class="blog-post-image" src="{{ page.featured_image | relative_url }}" alt="{{ page.featured_image_alt | default: page.title | escape }}">
    </div>
    <div class="blog-post-content">
      {{ content }}
    </div>
  </article>
</main>
